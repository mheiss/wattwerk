plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-quartz'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-arc'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:postgresql'
}

group = 'org.heiss'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.register('prepareDevConfig') {
    group = 'quarkus'
    description = 'Creates missing backend configuration from sample files.'
    def configs = [
        [source: file('./sample/application-dev.properties'), target: file('dev/application.properties')],
        [source: file('./sample/docker/database.yaml'), target: file('dev/docker/database.yaml')],
        [source: file('./sample/docker/db-init/001-source-tables.sql'), target: file('dev/docker/db-init/001-source-tables.sql')],
    ]
    inputs.files(configs.collect { it.source })
    doLast {
        configs.each { config ->
            def target = config.target.toPath()
            if (!java.nio.file.Files.exists(target)) {
                java.nio.file.Files.createDirectories(target.parent)
                java.nio.file.Files.copy(config.source.toPath(), target)
                logger.lifecycle('Created {}', config.target)
            }
        }
    }
}

tasks.named('quarkusDev') {
    jvmArgs = (jvmArgs ?: []) + [
        "-Dquarkus.config.locations=${file('dev/application.properties').toURI()}",
        '-Dquarkus.profile=dev'
    ]
}
