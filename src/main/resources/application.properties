# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c TimeZone=Europe/Vienna

# Total-consumed-power job series and units
wattwerk.jobs.total-consumed-power-aggregate.source.solar-item=FroniusSymo_Solar_Power
wattwerk.jobs.total-consumed-power-aggregate.source.grid-item=FroniusSymo_Grid_Power
wattwerk.jobs.total-consumed-power-aggregate.source.battery-item=FroniusSymo_Battery_Power
wattwerk.jobs.total-consumed-power-aggregate.source.unit=W
wattwerk.jobs.total-consumed-power-aggregate.output.series=FroniusSymo_TotalConsumed_Power
wattwerk.jobs.total-consumed-power-aggregate.output.unit=W
wattwerk.jobs.total-consumed-power-aggregate.lookback=12H
wattwerk.jobs.total-consumed-power-aggregate.source-bucket=5S
wattwerk.jobs.total-consumed-power-aggregate.output-bucket=5M

# Apply versioned schema and TimescaleDB hypertable changes before the application starts.
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog.xml

# Quarkus Quartz scheduler uses an in-memory job store; jobs are registered from application code.
quarkus.quartz.store-type=ram