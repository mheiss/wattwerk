apiVersion: influxdata.com/v2alpha1
kind: Task
metadata:
    name: victorious-haslett-e9401f
spec:
    every: 15s
    name: FroniusSymo_DirectConsumed_Power
    query: |-
        import "math"
        import "date"
        import "timezone"


        option location = timezone.location(name: "Europe/Vienna")
        option start = date.truncate(t: -12h, unit: 1s)

        solar =
            from(bucket: "openhab")
                |> range(start: start)
                |> filter(fn: (r) => r["_measurement"] == "FroniusSymo_Solar_Power")
                |> aggregateWindow(every: 5s, fn: mean)
                |> drop(columns: ["_start", "_stop"])
                |> group()

        toGrid =
            from(bucket: "openhab")
                |> range(start: start)
                |> filter(fn: (r) => r["_measurement"] == "FroniusSymo_Grid_Power")
                |> map(
                    fn: (r) =>
                        ({
                            _measurement: "FroniusSymo_Grid_Power",
                            _field: "value",
                            _value: if r._value <= 0.0 then math.abs(x: r._value) else 0.0,
                            _time: r._time,
                        }),
                )
                |> aggregateWindow(every: 5s, fn: mean)
                |> drop(columns: ["_start", "_stop"])
                |> group()

        toBattery =
            from(bucket: "openhab")
                |> range(start: start)
                |> filter(fn: (r) => r["_measurement"] == "FroniusSymo_Battery_Power")
                |> map(
                    fn: (r) =>
                        ({
                            _measurement: "FroniusSymo_Battery_Power",
                            _field: "value",
                            _value: if r._value <= 0.0 then math.abs(x: r._value) else 0.0,
                            _time: r._time,
                        }),
                )
                |> aggregateWindow(every: 5s, fn: mean)
                |> drop(columns: ["_start", "_stop"])
                |> group()

        // If we do send more energy to the battery than what is available via solar power
        // then we actually load the battery with grid power
        // That means the direct consumed power is all the solar power.
        union(tables: [solar, toGrid, toBattery])
            |> sort(columns: ["_time"])
            |> pivot(rowKey: ["_time"], columnKey: ["_measurement"], valueColumn: "_value")
            |> map(
                fn: (r) =>
                    ({
                        _value:
                            if r.FroniusSymo_Battery_Power >= r.FroniusSymo_Solar_Power then
                                r.FroniusSymo_Solar_Power
                            else
                                r.FroniusSymo_Solar_Power - r.FroniusSymo_Grid_Power
                                    -
                                    r.FroniusSymo_Battery_Power,
                        _time: r._time,
                    }),
            )
            |> filter(fn: (r) => r._value > 0)
            |> map(fn: (r) => ({r with _value: math.mMax(x: r._value, y: 0.0)}))
            |> map(fn: (r) => ({r with _measurement: "FroniusSymo_DirectConsumed_Power"}))
            |> map(fn: (r) => ({r with _field: "value"}))
            |> drop(columns: ["_start", "_stop"])
            |> to(bucket: "openhab")
