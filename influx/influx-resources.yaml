apiVersion: influxdata.com/v2alpha1
kind: Task
metadata:
    name: amusing-maxwell-e94009
spec:
    cron: 59 * * * *
    name: Energy_Revenue_Month
    offset: 50s
    query: |-
        import "date"
        import "timezone"



        option location = timezone.location(name: "Europe/Vienna")

        option source = "Energy_Revenue_Day"
        option destination = "Energy_Revenue_Month"

        from(bucket: "history")
            |> range(start: date.month(t: -3mo))
            |> filter(fn: (r) => r._measurement == source and r._field == "value")
            |> sort(desc: true)
            |> aggregateWindow(every: 1mo, fn: sum, createEmpty: false, offset: -1s)
            |> duplicate(column: "_measurement", as: "_measurement")
            |> drop(columns: ["_start", "_stop", "_result"])
            |> set(key: "_measurement", value: destination)
            |> truncateTimeColumn(unit: 1mo)
            |> to(bucket: "history")
