apiVersion: influxdata.com/v2alpha1
kind: Task
metadata:
    name: dazzling-borg-e94001
spec:
    every: 5m0s
    name: Energy_Cost_Aggregate
    query: |-
        import "timezone"
        import "date"



        option start = date.truncate(t: -24h, unit: 1h)
        option location = timezone.location(name: "Europe/Vienna")

        grid =
            from(bucket: "openhab")
                |> range(start: start)
                |> filter(fn: (r) => r["_measurement"] == "FroniusSymo_Grid_Power" and r["_value"] > 0)
                |> aggregateWindow(every: 1m, fn: mean)
                |> fill(value: 0.0)
                |> map(fn: (r) => ({r with _value: r._value / 60.0 / 1000.0}))
                |> aggregateWindow(every: 1h, fn: sum, timeSrc: "_start")
                |> drop(columns: ["_start", "_stop"])
                |> group()

        total =
            from(bucket: "openhab")
                |> range(start: start)
                |> filter(
                    fn: (r) => r["_measurement"] == "FroniusSymo_TotalConsumed_Power" and r["_value"] > 0,
                )
                |> aggregateWindow(every: 1m, fn: mean)
                |> fill(value: 0.0)
                |> map(fn: (r) => ({r with _value: r._value / 60.0 / 1000.0}))
                |> aggregateWindow(every: 1h, fn: sum, timeSrc: "_start")
                |> drop(columns: ["_start", "_stop"])
                |> group()

        priceSpot =
            from(bucket: "openhab")
                |> range(start: start)
                |> filter(fn: (r) => r["_measurement"] == "Energy_Price_Spot")
                |> drop(columns: ["_start", "_stop", "_field"])
                |> aggregateWindow(every: 1h, fn: mean, timeSrc: "_start")
                |> group()

        priceFix =
            from(bucket: "openhab")
                |> range(start: start)
                |> filter(fn: (r) => r["_measurement"] == "Energy_Price_Fix")
                |> drop(columns: ["_start", "_stop", "_field"])
                |> aggregateWindow(every: 1h, fn: mean, timeSrc: "_start")
                |> fill(value: 0.2182)
                |> group()

        // ======================
        // Real Costs
        // =======================
        union(tables: [grid, priceSpot])
            |> pivot(rowKey: ["_time"], columnKey: ["_measurement"], valueColumn: "_value")
            |> map(
                fn: (r) =>
                    ({
                        _time: r._time,
                        _measurement: "Energy_Cost_Spot",
                        _field: "value",
                        _value:
                            if exists r.Energy_Price_Spot then
                                r.FroniusSymo_Grid_Power * r.Energy_Price_Spot
                            else
                                0.0,
                    }),
            )
            |> to(bucket: "aggregated")

        union(tables: [grid, priceFix])
            |> pivot(rowKey: ["_time"], columnKey: ["_measurement"], valueColumn: "_value")
            |> map(
                fn: (r) =>
                    ({
                        _time: r._time,
                        _measurement: "Energy_Cost_Fix",
                        _field: "value",
                        _value:
                            if exists r.Energy_Price_Fix then
                                r.FroniusSymo_Grid_Power * r.Energy_Price_Fix
                            else
                                0.0,
                    }),
            )
            |> to(bucket: "aggregated")

        // ======================
        // Notional Costs
        // =======================
        union(tables: [total, priceSpot])
            |> pivot(rowKey: ["_time"], columnKey: ["_measurement"], valueColumn: "_value")
            |> map(
                fn: (r) =>
                    ({
                        _time: r._time,
                        _measurement: "Energy_NotionalCost_Spot",
                        _field: "value",
                        _value:
                            if exists r.Energy_Price_Spot then
                                r.FroniusSymo_TotalConsumed_Power * r.Energy_Price_Spot
                            else
                                0.0,
                    }),
            )
            |> to(bucket: "aggregated")

        union(tables: [total, priceFix])
            |> pivot(rowKey: ["_time"], columnKey: ["_measurement"], valueColumn: "_value")
            |> map(
                fn: (r) =>
                    ({
                        _time: r._time,
                        _measurement: "Energy_NotionalCost_Fix",
                        _field: "value",
                        _value:
                            if exists r.Energy_Price_Fix then
                                r.FroniusSymo_TotalConsumed_Power * r.Energy_Price_Fix
                            else
                                0.0,
                    }),
            )
            |> to(bucket: "aggregated")
---
