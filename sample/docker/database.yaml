services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: wattwerk
      POSTGRES_USER: wattwerk
      POSTGRES_PASSWORD: wattwerk
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wattwerk-dev-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattwerk -d wattwerk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wattwerk-dev-data: